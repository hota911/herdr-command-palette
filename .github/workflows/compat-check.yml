name: herdr compatibility check

# Runs scripts/check-compat.sh against the latest herdr release, so a herdr
# CLI change that breaks commands.json is caught even when nobody is
# actively working on this repo. See docs/design/command-catalog.md,
# section "Compatibility checks".
on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-compat:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.1, pinned to its release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install herdr
        run: |
          curl -fsSL https://herdr.dev/install.sh | sh
          # install.sh's default install dir; see $HOME/.local/bin in the
          # script (overridable via HERDR_INSTALL_DIR, not set here).
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install check-jsonschema
        run: pipx install check-jsonschema

      - name: Run compatibility check
        id: check
        run: |
          set -o pipefail
          if bash scripts/check-compat.sh 2>&1 | tee result.txt; then
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue on failure
        if: steps.check.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "herdr compatibility check failed ($(date -u +%Y-%m-%d))" \
            --body-file result.txt
